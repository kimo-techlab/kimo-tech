<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">

<style>

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:linear-gradient(135deg,#1303fa,#fcfcfc);
  color:#030303;
}

.container{
  max-width:1200px;
  margin:40px auto;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:40px;
  font-weight:900;
  letter-spacing:1px;
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:40px;
}

.card{
  background:linear-gradient(135deg,#639ed4,#524a68);
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(34, 29, 29, 0.4);
  text-align:center;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

select,input{
  padding:10px;
  border-radius:10px;
  border:none;
  outline:none;
}

.order-card{
  background:#ffffff;
  color:#111;
  padding:20px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 6px 15px rgba(0,0,0,.2);
  transition:.2s;
}

.order-card:hover{
  transform:scale(1.02);
}

.status{
  padding:6px 14px;
  border-radius:30px;
  font-size:12px;
  font-weight:bold;
  display:inline-block;
}

.pending{
  background:#facc15;
  color:#000;
}

.shipped{
  background:#38bdf8;
  color:#000;
}

.completed{
  background:#22c545;
  color:#fff;
}

.order-id{
  font-size:12px;
  color:#666;
  margin-bottom:5px;
}

/* Toast Container */
#toastContainer{
  position:fixed;
  top:20px;
  left:20px;
  z-index:99999;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* Toast */
.toast{
  background:#111827;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  min-width:220px;
  box-shadow:0 5px 20px rgba(0,0,0,.4);
  animation:slideIn .4s ease;
  font-size:14px;
}

.toast.success{
  background:#16a34a;
}

.toast.error{
  background:#dc2626;
}

.order-popup{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.78);
  backdrop-filter:blur(8px);
  z-index:9999;
  justify-content:center;
  align-items:center;
  padding:24px 16px;
}

.popup-shell{
  position:relative;
  width:min(720px,100%);
  max-height:min(88vh,900px);
  overflow:auto;
  background:linear-gradient(180deg,#ffffff 0%,#f8fbff 100%);
  color:#0f172a;
  border:1px solid rgba(148,163,184,.28);
  border-radius:28px;
  box-shadow:0 28px 80px rgba(15,23,42,.35);
  padding:28px;
}

.popup-close{
  position:absolute;
  top:16px;
  left:16px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:none;
  background:#e2e8f0;
  color:#0f172a;
  font-size:22px;
  line-height:1;
  cursor:pointer;
}

#popupContent{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.popup-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding-bottom:16px;
  border-bottom:1px solid #dbe4f0;
}

.popup-eyebrow{
  display:block;
  margin-bottom:6px;
  color:#0ea5e9;
  font-size:12px;
  font-weight:700;
}

.popup-title{
  margin:0;
  font-size:28px;
  line-height:1.25;
}

.popup-subtitle{
  margin:6px 0 0;
  color:#64748b;
  font-size:14px;
}

.popup-customer{
  background:linear-gradient(135deg,#eff6ff,#f8fafc);
  border:1px solid #dbeafe;
  border-radius:22px;
  padding:18px;
}

.popup-customer-name{
  margin:0 0 14px;
  font-size:23px;
  font-weight:900;
}

.popup-meta{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.popup-meta-card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:12px 14px;
}

.popup-meta-card span{
  display:block;
  margin-bottom:6px;
  color:#64748b;
  font-size:12px;
}

.popup-meta-card strong{
  display:block;
  color:#0f172a;
  font-size:14px;
  line-height:1.6;
  word-break:break-word;
}

.popup-section-title{
  margin:0 0 12px;
  font-size:18px;
  font-weight:800;
}

.popup-items{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.popup-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:14px 16px;
}

.popup-item-main{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.popup-item-name{
  font-size:15px;
  font-weight:800;
  line-height:1.5;
}

.popup-item-qty{
  background:#e0f2fe;
  color:#0369a1;
  border-radius:999px;
  padding:4px 10px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
}

.popup-item-price{
  color:#16a34a;
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
}

.popup-total{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#0f172a;
  color:#fff;
  border-radius:18px;
  padding:16px 18px;
}

.popup-total span{
  color:#cbd5e1;
  font-size:14px;
}

.popup-total strong{
  font-size:24px;
}

.popup-actions{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.popup-actions button{
  flex:1 1 140px;
  min-height:46px;
  border-radius:14px;
  font-size:14px;
}

.status-action.pending{background:#facc15;color:#111827;}
.status-action.shipped{background:#38bdf8;color:#082f49;}
.status-action.completed{background:#22c55e;color:#fff;}
.print-action{background:#0f172a;color:#fff;}
.delete-action{background:#dc2626;color:#fff;}

.popup-empty{
  background:#fff;
  border:1px dashed #cbd5e1;
  border-radius:16px;
  padding:18px;
  text-align:center;
  color:#64748b;
}

@media(max-width:700px){
  .order-popup{
    padding:16px 10px;
    align-items:flex-end;
  }

  .popup-shell{
    width:100%;
    max-height:92vh;
    border-radius:24px 24px 18px 18px;
    padding:22px 16px 18px;
  }

  .popup-header{
    flex-direction:column;
    align-items:stretch;
  }

  .popup-title{
    font-size:24px;
  }

  .popup-meta{
    grid-template-columns:1fr;
  }

  .popup-item{
    align-items:flex-start;
    flex-direction:column;
  }

  .popup-item-main{
    width:100%;
    justify-content:space-between;
  }

  .popup-item-price,
  .popup-total strong{
    font-size:20px;
  }

  .popup-actions button{
    flex:1 1 calc(50% - 5px);
  }
}

@keyframes slideIn{
  from{transform:translateX(-30px);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}
</style>
</head>

<script type="module">
  
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { 
  getFirestore,
  collection,
  getDocs,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  serverTimestamp,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2ff2ZaA-Xb_zQcVSUDaERS-glaFFR0TY",
  authDomain: "kimo-tech-store-962df.firebaseapp.com",
  projectId: "kimo-tech-store-962df",
  storageBucket: "kimo-tech-store-962df.firebasestorage.app",
  messagingSenderId: "845478890277",
  appId: "1:845478890277:web:3cdd3328bde1b5b9dda8cc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

import { signOut } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

window.logout = async function(){
  await signOut(auth);
  window.location.href = "admin-login.html";
}

import { getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

let currentRole = null;
let allOrders = [];
let unsubscribe = null;
let unsubscribeNotifications = null;
let activeOrderDetails = null;
let notificationsPrimed = false;
const audio = new Audio("notification.mp3");
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    if(unsubscribe){
      unsubscribe();
      unsubscribe = null;
    }

    if(unsubscribeNotifications){
      unsubscribeNotifications();
      unsubscribeNotifications = null;
    }

    notificationsPrimed = false;
    window.location.href = "admin-login.html";
    return;
  }

  const userDoc = await getDoc(doc(db, "users", user.uid));

  if(userDoc.exists()){
    currentRole = userDoc.data().role;
  }

  if(currentRole === "owner"){
    autoDeleteOldOrders();
  }

  if(unsubscribe){
    unsubscribe();
  }

  if(unsubscribeNotifications){
    unsubscribeNotifications();
  }

  notificationsPrimed = false;
  unsubscribe = onSnapshot(collection(db,"orders"), (snapshot)=>{

    allOrders = [];

    snapshot.forEach(docSnap=>{
      allOrders.push({
        id: docSnap.id,
        ...docSnap.data()
      });
    });
  
    renderOrders();
  });

  unsubscribeNotifications = onSnapshot(collection(db,"orders"), (snapshot)=>{
    if(!notificationsPrimed){
      notificationsPrimed = true;
      return;
    }

    const hasNewOrder = snapshot.docChanges().some((change)=> change.type === "added");

    if(!hasNewOrder){
      return;
    }

    audio.play().catch(()=>{});
    showToast("طلب جديد وصل 🔥","success");
  });
});





/* ================= صوت الإشعار ================= */

document.addEventListener("click", () => {
  audio.play().then(()=> audio.pause()).catch(()=>{});
},{ once:true });



/* ================= تحميل الطلبات ================= */

let chartInstance = null;
function animateCounter(id, target){
  let start = 0;
  const duration = 800;
  const increment = target / (duration / 16);

  const element = document.getElementById(id);

  const counter = setInterval(()=>{
    start += increment;
    if(start >= target){
      start = target;
      clearInterval(counter);
    }
if(id === "totalRevenue"){
  element.innerText = Math.floor(start) + " EGP";
}else{
  element.innerText = Math.floor(start);
}  },16);
}

let chart;

function updateChart(revenue, pending, completed){

  const ctx = document.getElementById('salesChart').getContext('2d');

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:'doughnut',
    data:{
      labels:['Revenue','Pending','Completed'],
      datasets:[{
        data:[revenue, pending, completed],
        backgroundColor:[
          '#22c55e',
          '#facc15',
          '#38bdf8'
        ]
      }]
    },
    options:{
      plugins:{
        legend:{
          labels:{
            color:'#fff'
          }
        }
      }
    }
  });
}

function renderOrders(){

  const searchValue = document.getElementById("searchInput").value.toLowerCase();
  const statusFilter = document.getElementById("statusFilter").value;
  const fromDate = document.getElementById("fromDate").value;
  const toDate = document.getElementById("toDate").value;
  const fromDateLimit = fromDate ? new Date(fromDate) : null;
  const toDateLimit = toDate ? new Date(toDate) : null;

  if(fromDateLimit){
    fromDateLimit.setHours(0, 0, 0, 0);
  }

  if(toDateLimit){
    toDateLimit.setHours(23, 59, 59, 999);
  }

  let total=0;
  let revenue=0;
  let pending=0;
  let completed=0;

  const container=document.getElementById("ordersContainer");
  container.innerHTML="";

  allOrders.forEach(data=>{

    const id = data.id;
    const customerName = (data.customerName || "").toLowerCase();
    const phone = String(data.phone || "");

    if(
      searchValue &&
      !customerName.includes(searchValue) &&
      !phone.includes(searchValue)
    ) return;

    const status=data.status || "pending";
    let orderDate = data.createdAt ? data.createdAt.toDate() : null;

    if(statusFilter !== "all" && status !== statusFilter) return;
    if(fromDateLimit && orderDate && orderDate < fromDateLimit) return;
    if(toDateLimit && orderDate && orderDate > toDateLimit) return;

    total++;

    if(status==="pending") pending++;
    if(status==="completed"){
      completed++;
      revenue += Number(data.total) || 0;
    }

    const card=document.createElement("div");
    card.className="order-card";
    card.style.cursor="pointer";
    card.onclick = () => openOrderDetails(data,id);

    card.innerHTML=`
      <div class="order-id">Order ID: ${id.slice(0,8).toUpperCase()}</div>
      <strong>${data.customerName || "Customer"}</strong>
      <div class="status ${status}">${status.toUpperCase()}</div>
      <div>💰 ${Number(data.total) || 0} EGP</div>
    `;

    container.appendChild(card);
  });

  animateCounter("totalOrders", total);
  animateCounter("pendingCount", pending);
  animateCounter("completedCount", completed);
  animateCounter("totalRevenue", revenue);
  updateChart(revenue, pending, completed);
}

/* ================= تصدير Excel ================= */

window.exportExcel = async function(){

  const snapshot = await getDocs(collection(db,"orders"));
  let csv = "Name,Phone,Total,Status\n";

  snapshot.forEach(doc=>{
    const d = doc.data();
    csv += `${d.customerName},${d.phone},${d.total},${d.status || "pending"}\n`;
  });

  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "orders.csv";
  a.click();
}

/* ================= حذف تلقائي بعد 30 يوم ================= */

async function autoDeleteOldOrders(){

  const snapshot = await getDocs(collection(db,"orders"));
  const now = new Date();

  snapshot.forEach(async (docSnap)=>{
    const data = docSnap.data();
    if(!data.createdAt) return;

    const orderDate = data.createdAt.toDate();
    const diff = (now - orderDate) / (1000*60*60*24);

    if(diff > 30){
      await deleteDoc(doc(db,"orders",docSnap.id));
    }
  });
}


document.getElementById("searchInput").addEventListener("keyup", renderOrders);
function getStatusLabel(status){
  return {
    pending:"قيد الانتظار",
    shipped:"تم الشحن",
    completed:"مكتمل"
  }[status] || status;
}

function getPaymentLabel(method){
  return {
    cash:"كاش",
    card:"بطاقة",
    wallet:"محفظة إلكترونية"
  }[method] || method || "غير محدد";
}

function getGroupedOrderItems(items){
  return Array.from((items || []).reduce((map, item)=>{
    const name = item.name || "منتج بدون اسم";
    const unitPrice = Number(item.price) || 0;
    const quantity = Number(item.quantity) || 1;
    const key = `${name}__${unitPrice}`;

    if(!map.has(key)){
      map.set(key, {
        name,
        unitPrice,
        quantity:0
      });
    }

    map.get(key).quantity += quantity;
    return map;
  }, new Map()).values());
}

function getOrderDetailsState(data,id){
  const status = data.status || "pending";
  const orderDate = data.createdAt
    ? data.createdAt.toDate().toLocaleString("ar-EG",{ dateStyle:"medium", timeStyle:"short" })
    : "غير متوفر";
  const groupedItems = getGroupedOrderItems(data.items);
  const totalPieces = groupedItems.reduce((sum,item)=> sum + item.quantity, 0);
  const totalAmount = Number(data.total) || 0;

  return {
    id,
    data,
    status,
    orderDate,
    groupedItems,
    totalPieces,
    totalAmount
  };
}

function buildOrderItemsMarkup(groupedItems){
  return groupedItems.map(item=>{
    const lineTotal = item.unitPrice * item.quantity;

    return `
      <div class="popup-item">
        <div class="popup-item-main">
          <strong class="popup-item-name">${item.name}</strong>
          <span class="popup-item-qty">x${item.quantity}</span>
        </div>
        <span class="popup-item-price">${lineTotal} EGP</span>
      </div>
    `;
  }).join("") || `<div class="popup-empty">لا توجد منتجات داخل هذا الطلب.</div>`;
}

function buildPrintableInvoiceDocument(order){
  const logoUrl = new URL("logo.png", window.location.href).href;
  const itemsMarkup = order.groupedItems.map(item=>{
    const lineTotal = item.unitPrice * item.quantity;

    return `
      <div class="invoice-item">
        <div class="invoice-item-main">
          <strong>${item.name}</strong>
          <span class="invoice-qty">x${item.quantity}</span>
        </div>
        <span class="invoice-price">${lineTotal} EGP</span>
      </div>
    `;
  }).join("") || `<div class="invoice-empty">لا توجد منتجات داخل هذا الطلب.</div>`;

  return `
    <html lang="ar" dir="rtl">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>فاتورة طلب ${order.id.slice(0,8).toUpperCase()}</title>
      <style>
        @page{
          size:A4;
          margin:12mm;
        }

        *{
          box-sizing:border-box;
        }

        body{
          margin:0;
          font-family:"Cairo",Arial,sans-serif;
          background:#eef4fb;
          color:#0f172a;
          -webkit-print-color-adjust:exact;
          print-color-adjust:exact;
        }

        .print-page{
          max-width:820px;
          margin:0 auto;
          padding:22px;
        }

        .invoice-sheet{
          background:#ffffff;
          border:1px solid #dbe4f0;
          border-radius:30px;
          padding:28px;
          box-shadow:0 18px 48px rgba(15,23,42,.12);
        }

        .invoice-head{
          display:flex;
          align-items:flex-start;
          justify-content:space-between;
          gap:16px;
          margin-bottom:18px;
        }

        .invoice-eyebrow{
          display:inline-block;
          color:#0ea5e9;
          font-size:12px;
          font-weight:800;
          letter-spacing:.08em;
        }

        .invoice-head h1{
          margin:8px 0 6px;
          font-size:30px;
          line-height:1.2;
        }

        .invoice-head p{
          margin:0;
          color:#64748b;
          font-size:14px;
        }

        .invoice-brand{
          display:flex;
          flex-direction:column;
          align-items:flex-end;
          gap:10px;
          text-align:left;
        }

        .invoice-brand img{
          width:84px;
          height:auto;
          object-fit:contain;
        }

        .invoice-brand strong{
          display:block;
          font-size:22px;
          line-height:1;
        }

        .invoice-brand span{
          color:#64748b;
          font-size:12px;
        }

        .invoice-chip-row{
          display:flex;
          flex-wrap:wrap;
          gap:10px;
          margin-bottom:18px;
        }

        .invoice-chip{
          display:inline-flex;
          align-items:center;
          justify-content:center;
          padding:8px 14px;
          border-radius:999px;
          font-size:13px;
          font-weight:700;
        }

        .invoice-chip.status{
          background:#dcfce7;
          color:#166534;
        }

        .invoice-chip.date{
          background:#e0f2fe;
          color:#075985;
        }

        .invoice-meta{
          display:grid;
          grid-template-columns:repeat(2,minmax(0,1fr));
          gap:14px;
          margin-bottom:24px;
        }

        .invoice-meta-card{
          background:#f8fbff;
          border:1px solid #dbe4f0;
          border-radius:18px;
          padding:14px 16px;
        }

        .invoice-meta-card span{
          display:block;
          margin-bottom:6px;
          color:#94a3b8;
          font-size:12px;
        }

        .invoice-meta-card strong{
          display:block;
          font-size:15px;
          line-height:1.65;
          word-break:break-word;
        }

        .invoice-section{
          margin-bottom:24px;
        }

        .invoice-section h2{
          margin:0 0 14px;
          font-size:24px;
        }

        .invoice-items{
          display:flex;
          flex-direction:column;
          gap:10px;
        }

        .invoice-item{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:16px;
          background:#fff;
          border:1px solid #dbe4f0;
          border-radius:18px;
          padding:14px 16px;
        }

        .invoice-item-main{
          display:flex;
          align-items:center;
          gap:10px;
          min-width:0;
        }

        .invoice-item-main strong{
          font-size:15px;
          line-height:1.5;
        }

        .invoice-qty{
          background:#dff0ff;
          color:#0284c7;
          border-radius:999px;
          padding:5px 10px;
          font-size:12px;
          font-weight:700;
          white-space:nowrap;
        }

        .invoice-price{
          color:#16a34a;
          font-size:22px;
          font-weight:900;
          white-space:nowrap;
        }

        .invoice-empty{
          background:#fff;
          border:1px dashed #cbd5e1;
          border-radius:18px;
          padding:18px;
          text-align:center;
          color:#64748b;
        }

        .invoice-total{
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:12px;
          background:#0f172a;
          color:#fff;
          border-radius:22px;
          padding:18px 20px;
        }

        .invoice-total span{
          color:#cbd5e1;
          font-size:14px;
        }

        .invoice-total strong{
          font-size:32px;
        }

        @media print{
          body{
            background:#fff;
          }

          .print-page{
            max-width:none;
            padding:0;
          }

          .invoice-sheet{
            border:none;
            border-radius:0;
            box-shadow:none;
            padding:0;
          }
        }
      </style>
    </head>
    <body>
      <div class="print-page">
        <div class="invoice-sheet">
          <div class="invoice-head">
            <div>
              <span class="invoice-eyebrow">KIMO TECH</span>
              <h1>فاتورة طلب</h1>
              <p>رقم الطلب: ${order.id.slice(0,8).toUpperCase()}</p>
            </div>
            <div class="invoice-brand">
              <img src="${logoUrl}" alt="KIMO TECH" onerror="this.style.display='none'">
              <div>
                <strong>KIMO TECH</strong>
                <span>Electronics & Robotics</span>
              </div>
            </div>
          </div>

          <div class="invoice-chip-row">
            <span class="invoice-chip status">${getStatusLabel(order.status)}</span>
            <span class="invoice-chip date">${order.orderDate}</span>
          </div>

          <div class="invoice-meta">
            <div class="invoice-meta-card">
              <span>اسم العميل</span>
              <strong>${order.data.customerName || "عميل بدون اسم"}</strong>
            </div>
            <div class="invoice-meta-card">
              <span>رقم الهاتف</span>
              <strong>${order.data.phone || "-"}</strong>
            </div>
            <div class="invoice-meta-card">
              <span>طريقة الدفع</span>
              <strong>${getPaymentLabel(order.data.paymentMethod)}</strong>
            </div>
            <div class="invoice-meta-card">
              <span>العنوان</span>
              <strong>${order.data.address || "لا يوجد عنوان"}</strong>
            </div>
            <div class="invoice-meta-card">
              <span>الأصناف والقطع</span>
              <strong>${order.groupedItems.length} نوع / ${order.totalPieces} قطعة</strong>
            </div>
            <div class="invoice-meta-card">
              <span>وقت الطباعة</span>
              <strong>${new Date().toLocaleString("ar-EG",{ dateStyle:"medium", timeStyle:"short" })}</strong>
            </div>
          </div>

          <div class="invoice-section">
            <h2>المنتجات</h2>
            <div class="invoice-items">${itemsMarkup}</div>
          </div>

          <div class="invoice-total">
            <span>الإجمالي النهائي</span>
            <strong>${order.totalAmount} EGP</strong>
          </div>
        </div>
      </div>
    </body>
    </html>
  `;
}

window.openOrderDetails = function(data,id){

  const order = getOrderDetailsState(data,id);
  const itemsHTML = buildOrderItemsMarkup(order.groupedItems);

  activeOrderDetails = order;

  document.getElementById("popupContent").innerHTML = `
    <div class="popup-header">
      <div>
        <span class="popup-eyebrow">تفاصيل الطلب</span>
        <h3 class="popup-title">طلب ${id.slice(0,8).toUpperCase()}</h3>
        <p class="popup-subtitle">${order.orderDate}</p>
      </div>
      <div class="status ${order.status}">${getStatusLabel(order.status)}</div>
    </div>

    <div class="popup-customer">
      <h4 class="popup-customer-name">${data.customerName || "عميل بدون اسم"}</h4>
      <div class="popup-meta">
        <div class="popup-meta-card">
          <span>رقم الهاتف</span>
          <strong>${data.phone || "-"}</strong>
        </div>
        <div class="popup-meta-card">
          <span>طريقة الدفع</span>
          <strong>${getPaymentLabel(data.paymentMethod)}</strong>
        </div>
        <div class="popup-meta-card">
          <span>العنوان</span>
          <strong>${data.address || "لا يوجد عنوان"}</strong>
        </div>
        <div class="popup-meta-card">
          <span>الأصناف والقطع</span>
          <strong>${order.groupedItems.length} نوع / ${order.totalPieces} قطعة</strong>
        </div>
      </div>
    </div>

    <div>
      <h4 class="popup-section-title">المنتجات</h4>
      <div class="popup-items">${itemsHTML}</div>
    </div>

    <div class="popup-total">
      <span>الإجمالي النهائي</span>
      <strong>${order.totalAmount} EGP</strong>
    </div>

    <div class="popup-actions">
      <button class="status-action pending" onclick="changeStatus('${id}','pending')">قيد الانتظار</button>
      <button class="status-action shipped" onclick="changeStatus('${id}','shipped')">تم الشحن</button>
      <button class="status-action completed" onclick="changeStatus('${id}','completed')">مكتمل</button>
      <button class="print-action" onclick="printOrder()">طباعة</button>
      ${currentRole === "owner" ? `<button class="delete-action" onclick="deleteOrder('${id}')">حذف الطلب</button>` : ``}
    </div>
  `;

  document.getElementById("orderPopup").style.display="flex";
}


window.changeStatus = async function(id,newStatus){

  try{

    await updateDoc(doc(db,"orders",id),{
      status:newStatus
    });

    showToast("تم تحديث حالة الطلب ✅","success");

    closePopup();

  }catch(error){

    console.error(error);
    showToast("حصل خطأ في تحديث الطلب ❌","error");

  }
}



window.deleteOrder = async function(id){

  if(!confirm("هل أنت متأكد من حذف الطلب؟")){
    return;
  }

  try{
    await deleteDoc(doc(db,"orders",id));
    showToast("تم حذف الطلب 🗑","success");
    closePopup();
  }catch(error){
    console.error(error);
    showToast("غير مسموح بالحذف ❌","error");
  }
}

window.closePopup = function(){
  document.getElementById("orderPopup").style.display="none";
}

document.addEventListener("keydown", (event)=>{
  if(event.key === "Escape"){
    closePopup();
  }
});

window.printOrder = function(){
  if(!activeOrderDetails){
    showToast("افتح الطلب أولاً قبل الطباعة","error");
    return;
  }

  const printWindow = window.open("", "", "width=800,height=600");
  if(!printWindow){
    showToast("اسمح بفتح نافذة الطباعة أولاً","error");
    return;
  }

  printWindow.document.write(buildPrintableInvoiceDocument(activeOrderDetails));

  printWindow.document.close();
  printWindow.focus();
  printWindow.onafterprint = () => printWindow.close();
  setTimeout(()=>{
    printWindow.print();
  },300);
}


</script>

<script>

window.showToast = function(message,type="success"){

const container = document.getElementById("toastContainer");

  const toast = document.createElement("div");
  toast.className = "toast " + type;
  toast.innerText = message;

  container.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },3000);
}
</script>
