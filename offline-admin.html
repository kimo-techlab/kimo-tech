<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#07101f">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>لا يوجد اتصال | KIMO TECH Admin</title>
<link rel="icon" href="favicon.png">
<style>
  *{box-sizing:border-box}
  body{
    min-height:100vh;
    margin:0;
    padding:24px;
    display:grid;
    place-items:center;
    color:#0f172a;
    background:
      radial-gradient(circle at 90% 5%,rgba(34,197,94,.14),transparent 20rem),
      radial-gradient(circle at 0 50%,rgba(14,165,233,.12),transparent 22rem),
      #f3f6fb;
    font-family:"Segoe UI",Tahoma,Arial,sans-serif;
  }
  main{
    width:min(430px,100%);
    padding:32px 24px;
    background:#fff;
    border:1px solid #dfe7f1;
    border-radius:26px;
    box-shadow:0 24px 60px rgba(15,23,42,.12);
    text-align:center;
  }
  .mark{
    width:72px;
    height:72px;
    margin:0 auto 18px;
    display:grid;
    place-items:center;
    color:#052e16;
    background:linear-gradient(135deg,#4ade80,#22c55e);
    border-radius:22px;
    font-size:28px;
    font-weight:900;
  }
  h1{margin:0 0 9px;font-size:25px}
  p{margin:0;color:#64748b;line-height:1.9}
  .actions{margin-top:22px;display:grid;gap:10px}
  button,a{
    min-height:48px;
    padding:11px 15px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:#0f172a;
    border:0;
    border-radius:13px;
    font:inherit;
    font-weight:800;
    text-decoration:none;
    cursor:pointer;
  }
  a{color:#075985;background:#e0f2fe}
  button:focus-visible,a:focus-visible{outline:3px solid #0ea5e9;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">K</div>
  <h1>مفيش اتصال بالإنترنت</h1>
  <p>واجهة التطبيق متاحة، لكن بيانات الإدارة والتعديلات تحتاج اتصالًا آمنًا بـFirebase.</p>
  <div class="actions">
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    <a href="mobile-admin.html">الرجوع للرئيسية</a>
  </div>
</main>
</body>
</html>
