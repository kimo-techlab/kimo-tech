:root{

}

body{

}

/* ===== Robot Watermark ===== */
.robot-bg{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at center, rgba(125, 125, 125, 0.225), rgba(0, 0, 0, 0.893)),

  opacity:0.75;
  pointer-events:none;
  z-index:-1;
}

/* ===== Top Bar ===== */
.top-bar{
  background:var(--dark);
  color:#fff;
  text-align:center;
  padding:10px;
  font-weight:bold;
  position:relative;
  z-index:2;
}

/* ===== Header ===== */
header{
  background:#fff;
  padding:22px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
.logo{
  font-size:32px;
  font-weight:900;
}
.logo span{color:var(--accent);}





/* ===== تعديل التصنفات ===== */
.top-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.control-btn{
  padding:8px 14px;
  border-radius:10px;
  background:#fff;
  color:#2d3436;
  border:2px solid #0984e3;
  font-size:13px;
  cursor:pointer;
  box-shadow:0 4px 6px rgba(0,0,0,0.1);
  transition:.2s ease;
}

.control-btn:hover{
  border-color:#22c55e;
  box-shadow:0 6px 12px rgba(0,0,0,0.15);
}

.sort-small{
  width:120px;
}
/* ===== تعديل الترتيب ===== */
.sort-select{
  padding:10px 15px;
  border-radius:10px;
  margin-top:-30px;
  position:relative;
  z-index:10;

  background:#ffffff;
  color:#2d3436;
  border:2px solid #0984e3;

  font-size:14px;
  cursor:pointer;
  outline:none;
  box-shadow:0 4px 6px rgba(0,0,0,0.1);
  transition:.2s ease;
}

.sort-select:hover{
  border-color:#0ea5e9;
  box-shadow:0 6px 12px rgba(0,0,0,0.15);
}

.sort-select:focus{
  border-color:#22c55e;
}
/* ===== Layout ===== */
.container{
  max-width:1400px;
  margin:auto;
  padding:35px 20px;
  display:flex;
  gap:30px;
  position:relative;
  z-index:2;
}
.sidebar{
  width:260px;
  background:#fff;
  padding:28px;
  border-radius:22px;
  box-shadow:0 12px 30px rgba(0,0,0,.06);
}
.sidebar h3{

  padding-bottom:12px;
}
.sidebar li{
  list-style:none;
  padding:14px;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  margin-bottom:6px;
}
.sidebar li:hover,
.sidebar li.active{
  background:var(--accent);
  color:#fff;
}

.main{flex:1;}

#categoryTitle{
  font-size:22px;
  font-weight:900;
  margin-bottom:25px;
}

@media(max-width:768px){
  #categoryTitle{

    text-align:center;
    margin-bottom:15px;
  }
}


.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:28px;
}

/* ===== Card ===== */
.card{
  background:#fff;
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
    transition: all .3s ease;

}
.card:hover{
  transform: translateY(-8px);
  box-shadow:0 18px 40px rgba(0,0,0,.15);
}
.badge{
  position:absolute;
  top:12px;
  left:12px;
  background:linear-gradient(135deg,#1b0bf5,#17472ab7);
  color:#fff;
  padding:6px 12px;
  font-size:12px;
  font-weight:bold;
  border-radius:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.2);
  z-index:2;
  
}

.card img{
  width:100%;
  height:210px;
  object-fit:contain;
  padding:22px;
}
.card-info{
  padding:22px;
  text-align:center;
}
.price{
  font-size:1.4rem;
  font-weight:900;
  color:var(--accent);
}
.add-btn{

  padding:14px;

  border-radius:14px;

  color:#fff;
  font-weight:bold;
  cursor:pointer;

.nav-left a:hover::after{

/* ===== Cart ===== */

}
