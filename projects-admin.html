<html lang="ar" dir="rtl">
<head>

<style>
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:linear-gradient(135deg,#1303fa,#fcfcfc);
}

.container{
  max-width:1100px;
  margin:40px auto;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:30px;
  font-weight:900;
}

.top-bar{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
  gap:10px;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn{background:#16a34a;color:#fff;}
.back-btn{background:#5726dc;color:#fff;}

.table{
  background:#ffffff;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.table-header,
.table-row{
  display:grid;
  grid-template-columns: 60px 80px 1fr 120px 120px 120px 200px;
  padding:12px;
  align-items:center;
}

.table-row:hover{
  background:#f8fafc;
  transform:scale(1.01);
}

img{
  transition:.3s;
}

.table-row:hover img{
  transform:scale(1.08);
}

.table-row{border-bottom:1px solid #eee;}
.table-row:last-child{border-bottom:none;}

.stock-yes{color:#16a34a;font-weight:bold;}
.stock-no{color:#dc2626;font-weight:bold;}

.badge{
  background:#facc15;
  color:#000;
  padding:3px 8px;
  font-size:11px;
  border-radius:20px;
  margin-right:8px;
  font-weight:bold;
}

.action-btn{
  padding:6px 10px;
  border-radius:8px;
  font-size:12px;
  margin-left:5px;
}

.edit{background:#facc15;}
.delete{background:#dc2626;color:#fff;}
.toggle{background:#38bdf8;}

.search{
  padding:10px;
  border-radius:10px;
  border:none;
  width:250px;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:#fff;
  padding:30px;
  border-radius:16px;
  width:400px;

  display:flex;
  flex-direction:column;
  gap:15px;

  max-height:90vh;      /* يخليه ما يعديش الشاشة */
  overflow-y:auto;      /* يضيف Scroll */
}
.modal-content::-webkit-scrollbar{
  width:6px;
}
.modal-content::-webkit-scrollbar-thumb{
  background:#22c55e;
  border-radius:10px;
}
.modal input{
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
}

.toast{
  position:fixed;
  bottom:20px;
  left:20px;
  background:#111;
  color:#fff;
  padding:10px 15px;
  border-radius:8px;
  display:none;
  max-width:calc(100vw - 24px);
  z-index:9999;
}
#bulkInput{
  width:100%;
  min-height:280px;
  padding:18px;
  border-radius:14px;
  border:2px solid #0ea5e9;
  background:#0d255e;
  color:#22c55e;
  font-family:monospace;
  font-size:15px;
  line-height:1.6;
  resize:vertical;
}
</style>
<link rel="stylesheet" href="admin-ui.css">
<script src="admin-ui.js" defer></script>
</head>

<body class="admin-page" data-admin-page="projects">

<div class="container">
<div class="admin-page-header">
  <div>
    <h1>🧠 إدارة المشروعات</h1>
    <p class="admin-page-subtitle">نظّم المشروعات وعدّل السعر والوصف والصورة وحالة التوفر بسهولة.</p>
  </div>
</div>

<div class="top-bar">
<button class="back-btn" onclick="window.location.href='./admin.html'">
⬅ رجوع
</button>
  <div>
    <input type="search" id="searchInput" class="search" placeholder="ابحث في المشروعات" aria-label="البحث في المشروعات">
    <select id="categoryFilter" class="search" aria-label="فلترة المشروعات حسب التصنيف">
  <option value="all">كل التصنيفات</option>
</select>
    <button class="add-btn" onclick="openModal()">➕ إضافة مشروع</button>
  </div>
</div>

<div class="table">
<div class="table-header">
  <div>الترتيب</div>
  <div>الصورة</div>
  <div>الاسم</div>
  <div>السعر</div>
  <div>التصنيف</div>
  <div>الحالة</div>
  <div>إجراءات</div>
</div>
  <div id="projectsContainer" aria-live="polite">
    <div class="admin-loading">جاري تحميل المشروعات...</div>
  </div>
</div>
</div>

<!-- Modal -->
<div class="modal" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
<h3 id="modalTitle">إضافة مشروع</h3>

<input type="text" id="pName" placeholder="اسم مشروع">
<input type="number" id="pPrice" placeholder="السعر">
<input type="text" id="pCategory" placeholder="التصنيف">
<input type="text" id="pImage" placeholder="رابط الصورة">
<input type="text" id="pDesc" placeholder="الوصف">

<select id="pBadge">
  <option value="">بدون Badge</option>
  <option value="Original">أصلي</option>
  <option value="New">جديد</option>
  <option value="Popular">الأكثر طلبًا</option>
  <option value="Student">مناسب للطلاب</option>
</select>

<label style="display:flex;align-items:center;gap:8px;">
  <input type="checkbox" id="pStock" checked>
  متاح
</label>

<button class="add-btn" id="projectSaveBtn" type="button" onclick="saveProject()">حفظ</button>
<button onclick="closeModal()">إلغاء</button>
<hr>

<h4>إضافة مجموعة مشروعات</h4>

<textarea id="bulkInput" 
  placeholder='[
 { name:"Arduino UNO", price:450, category:"Arduino" },
 { name:"MQ-2", price:100, category:"Sensors" }
]' 
  style="height:120px; padding:10px; border-radius:10px;"></textarea>

<button onclick="bulkUpload()" 
  style="background:#111;color:#fff;padding:10px;border-radius:10px;">
  رفع المجموعة
</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { 
  getFirestore,
  collection,
  onSnapshot,
  addDoc,
  deleteDoc,
  updateDoc,
  doc,
  serverTimestamp,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

import { 
  getAuth,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2ff2ZaA-Xb_zQcVSUDaERS-glaFFR0TY",
  authDomain: "kimo-tech-store-962df.firebaseapp.com",
  projectId: "kimo-tech-store-962df",
  storageBucket: "kimo-tech-store-962df.firebasestorage.app",
  messagingSenderId: "845478890277",
  appId: "1:845478890277:web:3cdd3328bde1b5b9dda8cc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let currentRole = null;
let allprojects = [];
let projectsLoaded = false;
let projectsLoadFailed = false;
document.getElementById("searchInput").addEventListener("keyup", filterprojects);

function escapeHtml(text){
  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function getOrderValue(value){
  if(value === null || value === undefined || value === ""){
    return 9999;
  }

  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : 9999;
}

function parseBulkCollectionInput(raw){
  const cleaned = raw
    .trim()
    .replace(/^\s*(?:const|let|var)\s+\w+\s*=\s*/, "")
    .replace(/;\s*$/, "");

  try{
    return JSON.parse(cleaned);
  }catch(jsonError){
    const normalized = cleaned
      .replace(/([{,]\s*)([A-Za-z_][\w-]*)\s*:/g, '$1"$2":')
      .replace(/'/g, '"')
      .replace(/,\s*([}\]])/g, "$1");

    return JSON.parse(normalized);
  }
}

function filterprojects(){
  if(!projectsLoaded || projectsLoadFailed){
    return;
  }

  const q = document.getElementById("searchInput").value.toLowerCase();
  const selectedCategory = document.getElementById("categoryFilter").value;

  const filtered = allprojects.filter(p=>{

    const matchesSearch =
      p.name?.toLowerCase().includes(q) ||
      p.category?.toLowerCase().includes(q) ||
      p.badge?.toLowerCase().includes(q);

    const matchesCategory =
      selectedCategory === "all" || p.category === selectedCategory;

    return matchesSearch && matchesCategory;
  });

  renderprojects(filtered);
}
document.getElementById("categoryFilter").addEventListener("change", function(){
  filterprojects();
});

let editId = null;

/* ================= حماية الصفحة ================= */

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "admin-login.html";
    return;
  }

  try{
    const userDoc = await getDoc(doc(db,"users",user.uid));

    if(!userDoc.exists()){
      window.location.href = "admin-login.html";
      return;
    }

    currentRole = String(userDoc.data().role || "").trim().toLowerCase();

    if(currentRole !== "owner"){
      alert("غير مصرح لك بالدخول");
      window.location.href = "dashboard.html";
      return;
    }

    sessionStorage.setItem("adminRole", currentRole);
    window.setAdminNavigationRole?.(currentRole);
    startprojectsListener();
  }catch(error){
    console.error(error);
    showProjectsState("تعذر التحقق من صلاحية الدخول. تأكد من اتصال الإنترنت ثم حدّث الصفحة.");
  }
});

/* ================= تحميل مشروع ================= */

function showProjectsState(message){
  projectsLoaded = true;
  projectsLoadFailed = true;
  document.getElementById("projectsContainer").innerHTML = `
    <div class="admin-empty">${escapeHtml(message)}</div>
  `;
}

function startprojectsListener(){
  onSnapshot(collection(db,"projects"), snapshot=>{
    allprojects = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
    }));

    allprojects.sort((a,b)=>{
      const orderA = getOrderValue(a.order);
      const orderB = getOrderValue(b.order);

      if(orderA === orderB){
        return (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);
      }
      return orderA - orderB;
    });

    projectsLoaded = true;
    projectsLoadFailed = false;
    populateCategories();
    filterprojects();
  }, error=>{
    console.error(error);
    showProjectsState("تعذر تحميل المشروعات من قاعدة البيانات. حاول تحديث الصفحة.");
  });
}

function populateCategories(){
  const select = document.getElementById("categoryFilter");
  const currentValue = select.value;

  const categories = [...new Set(allprojects.map(p=>p.category).filter(Boolean))];

  select.innerHTML = `<option value="all">كل التصنيفات</option>`;

  categories.forEach(cat=>{
    select.innerHTML += `<option value="${escapeHtml(cat)}">${escapeHtml(cat)}</option>`;
  });

  if([...select.options].some((option)=> option.value === currentValue)){
    select.value = currentValue;
  }
}


window.updateOrder = async function(id, newOrder){

  const orderNumber = Number(newOrder);

  if(String(newOrder).trim() === "" || !Number.isFinite(orderNumber)){
    showToast("رقم غير صحيح ❌","error");
    return;
  }

  try{
    await updateDoc(doc(db,"projects",id),{
      order: orderNumber,
      updatedAt: serverTimestamp()
    });

    showToast("تم تحديث الترتيب ✅","success");

  }catch(error){
    console.error(error);
    showToast("حصل خطأ ❌","error");
  }
}

function renderprojects(list){

  const container = document.getElementById("projectsContainer");
  container.innerHTML = "";

  if(!list.length){
    const hasActiveFilters =
      document.getElementById("searchInput").value.trim() ||
      document.getElementById("categoryFilter").value !== "all";
    const emptyMessage = hasActiveFilters
      ? "لا توجد مشروعات مطابقة للبحث أو التصنيف الحالي."
      : "لا توجد مشروعات مضافة حتى الآن.";
    container.innerHTML = `<div class="admin-empty">${emptyMessage}</div>`;
    return;
  }

  list.forEach(p=>{
    const orderValue = getOrderValue(p.order);
    const imageUrl = escapeHtml(p.image || "images/no-image.png");
    const name = escapeHtml(p.name || "");
    const badge = escapeHtml(p.badge || "");
    const category = escapeHtml(p.category || "-");
    const priceLabel = Number.isFinite(Number(p.price)) ? `${Number(p.price)} ج.م` : "—";
    const stockClass = p.inStock ? "stock-yes" : "stock-no";
    const stockLabel = p.inStock ? "متاح" : "غير متاح";
    const projectId = escapeHtml(JSON.stringify(p.id));

    container.innerHTML += `
  <div class="table-row">

<div>
  <input 
    type="number" 
    value="${orderValue}" 
    style="width:70px;padding:5px;border-radius:6px;border:1px solid #ccc;"
    onchange='updateOrder(${projectId}, this.value)'
  >
</div>
    <div>
      <img src="${imageUrl}" alt="${name}" onerror="this.src='images/no-image.png';this.onerror=null;"
      style="width:60px;height:60px;object-fit:cover;border-radius:10px;">
    </div>

        <div>
          ${name}
          ${badge ? `<span class="badge">${badge}</span>` : ``}
        </div>

        <div>${escapeHtml(priceLabel)}</div>
        <div>${category}</div>

        <div class="${stockClass}">
          ${stockLabel}
        </div>

        <div>
          <button class="action-btn toggle" type="button" onclick='toggleStock(${projectId}, ${Boolean(p.inStock)})'>تبديل الحالة</button>
          <button class="action-btn edit" type="button" onclick='editProduct(${projectId})'>تعديل</button>
          <button class="action-btn delete" type="button" onclick='deleteProduct(${projectId})'>حذف</button>
        </div>
      </div>
    `;
  });

}


window.deleteProduct = async function(id){
  if(!confirm("متأكد من الحذف؟")) return;

  try{
    await deleteDoc(doc(db,"projects",id));
    showToast("تم حذف المشروع","success");
  }catch(error){
    console.error(error);
    showToast("تعذر حذف المشروع","error");
  }
}

window.toggleStock = async function(id,current){
  try{
    await updateDoc(doc(db,"projects",id),{
      inStock: !current,
      updatedAt: serverTimestamp()
    });
    showToast("تم تحديث حالة المشروع","success");
  }catch(error){
    console.error(error);
    showToast("تعذر تحديث حالة المشروع","error");
  }
}




window.editProduct = function(id){
  const p = allprojects.find(x=>x.id===id);
  if(!p){
    showToast("تعذر العثور على المشروع","error");
    return;
  }

  editId = id;

  document.getElementById("modalTitle").innerText = "تعديل مشروع";

  document.getElementById("pName").value = p.name || "";
  document.getElementById("pPrice").value = p.price || "";
  document.getElementById("pCategory").value = p.category || "";
  document.getElementById("pImage").value = p.image || "";
document.getElementById("pDesc").value = p.description || "";
  document.getElementById("pBadge").value = p.badge || "";
  document.getElementById("pStock").checked = p.inStock ?? true;

  document.getElementById("projectModal").style.display = "flex";
}

window.openModal = function(){
  editId = null;
  document.getElementById("modalTitle").innerText = "إضافة مشروع";
  resetForm();
  document.getElementById("projectModal").style.display = "flex";
}

window.closeModal = function(){
  editId = null;
  document.getElementById("projectModal").style.display="none";
}

window.saveProject = async function(){

  const name = document.getElementById("pName").value.trim();
  const price = Number(document.getElementById("pPrice").value);
  const category = document.getElementById("pCategory").value.trim();
  const image = document.getElementById("pImage").value.trim();
  const description = document.getElementById("pDesc").value.trim();
  const badge = document.getElementById("pBadge").value.trim();
  const inStock = document.getElementById("pStock").checked;

  if(!name || !Number.isFinite(price) || price <= 0){
    alert("الاسم والسعر مطلوبين");
    return;
  }

  const saveButton = document.getElementById("projectSaveBtn");
  saveButton.disabled = true;
  saveButton.textContent = "جاري الحفظ...";

  try{

if(editId){
  await updateDoc(doc(db,"projects",editId),{
    name,
    price,
    category,
    image,
    description, // ✅ الصح
    badge,
    inStock,
    updatedAt: serverTimestamp()
  });
      showToast("تم التعديل ✅","success");
    }else{
await addDoc(collection(db,"projects"),{
  name,
  price,
  category,
  image,
  description, // ✅ الصح
  badge,
  inStock,
  order: 9999,
  createdAt: serverTimestamp(),
  updatedAt: serverTimestamp()
});
      showToast("تمت الإضافة ✅","success");
    }

    // 👇 هنا السر
    editId = null;
    resetForm();
    window.closeModal();

  }catch(error){
    console.error(error);
    showToast("في مشكلة ❌","error");
  }finally{
    saveButton.disabled = false;
    saveButton.textContent = "حفظ";
  }
}
window.bulkUpload = async function(){

  const raw = document.getElementById("bulkInput").value.trim();

  if(!raw){
    alert("حط المشروعات الأول");
    return;
  }

  let projects;

  try{
    projects = parseBulkCollectionInput(raw);
  }catch(err){
    alert("في مشكلة في الصيغة ❌");
    return;
  }

  if(!Array.isArray(projects)){
    alert("لازم تبعت Array مش مشروع واحد");
    return;
  }

  const invalidIndex = projects.findIndex((project) =>
    !String(project?.name || "").trim() ||
    !Number.isFinite(Number(project?.price)) ||
    Number(project.price) <= 0
  );

  if(invalidIndex !== -1){
    alert(`المشروع رقم ${invalidIndex + 1} يحتاج اسمًا وسعرًا صحيحًا أكبر من صفر`);
    return;
  }

  try{

    for(const p of projects){

     await addDoc(collection(db,"projects"),{
  name: String(p.name).trim(),
  price: Number(p.price),
  category: p.cat || p.category || "",
  image: p.image || p.img || "",
  description: p.description || "", // ✅ المهم
  badge: p.badge || "",
  inStock: p.inStock !== false,
  order: getOrderValue(p.order),
  createdAt: serverTimestamp(),
  updatedAt: serverTimestamp()
});

    }

    showToast("تم رفع مشروع 🔥","success");

    document.getElementById("bulkInput").value = "";

  }catch(error){
    console.error(error);
    showToast("حصل خطأ ❌","error");
  }
}
function resetForm(){
  document.getElementById("pName").value = "";
  document.getElementById("pPrice").value = "";
  document.getElementById("pCategory").value = "";
  document.getElementById("pImage").value = "";
  document.getElementById("pDesc").value = "";
  document.getElementById("pBadge").value = "";
  document.getElementById("pStock").checked = true;
}


function showToast(message, type = "success"){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.style.background = type === "error" ? "#dc2626" : "#111827";
  toast.style.display = "block";

  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>{
    toast.style.display = "none";
  },3000);
}

window.showToast = showToast;

document.getElementById("projectModal").addEventListener("click", (event) => {
  if(event.target === event.currentTarget){
    window.closeModal();
  }
});

document.addEventListener("keydown", (event) => {
  if(event.key === "Escape" && document.getElementById("projectModal").style.display === "flex"){
    window.closeModal();
  }
});
</script>

</body>
</html>
