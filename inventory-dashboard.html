<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<title>إدارة المخزون | KIMO TECH</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-start:#0b1020;
  --bg-end:#172554;
  --panel:#ffffff;
  --panel-soft:#f8fbff;
  --line:#dbe4f0;
  --text:#0f172a;
  --muted:#64748b;
  --primary:#0ea5e9;
  --success:#22c55e;
  --warning:#f59e0b;
  --danger:#ef4444;
  --shadow:0 18px 48px rgba(15,23,42,.14);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:
    radial-gradient(circle at top right, rgba(34,197,94,.18), transparent 24%),
    radial-gradient(circle at left center, rgba(14,165,233,.16), transparent 22%),
    linear-gradient(135deg,var(--bg-start),var(--bg-end));
  color:#fff;
  min-height:100vh;
}

.container{
  max-width:1240px;
  margin:0 auto;
  padding:32px 18px 48px;
}

.page-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:26px;
}

.page-head h1{
  margin:0 0 10px;
  font-size:34px;
  line-height:1.2;
}

.page-head p{
  margin:0;
  color:rgba(255,255,255,.75);
}

.head-actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.link-btn,
.primary-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:46px;
  padding:0 16px;
  border:none;
  border-radius:14px;
  text-decoration:none;
  font-weight:800;
  cursor:pointer;
}

.link-btn{
  background:rgba(255,255,255,.14);
  color:#fff;
  border:1px solid rgba(255,255,255,.14);
}

.primary-btn{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:#fff;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:14px;
  margin-bottom:18px;
}

body.admin-page[data-admin-page="inventory"] .stats-grid{
  grid-template-columns:repeat(5,minmax(0,1fr));
}

.stat-card{
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:18px;
  box-shadow:0 12px 32px rgba(0,0,0,.12);
  backdrop-filter:blur(10px);
}

.stat-card span{
  display:block;
  margin-bottom:10px;
  color:rgba(255,255,255,.72);
  font-size:13px;
}

.stat-card strong{
  font-size:32px;
  line-height:1;
}

.controls-panel{
  background:var(--panel);
  color:var(--text);
  border-radius:28px;
  padding:18px;
  box-shadow:var(--shadow);
}

.filters{
  display:grid;
  grid-template-columns:minmax(260px,1.6fr) repeat(3,minmax(150px,1fr));
  gap:12px;
  margin-bottom:16px;
}

.search-input,
.filter-select{
  width:100%;
  min-height:48px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:14px;
  outline:none;
  background:#fff;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
}

.table-shell{
  background:var(--panel-soft);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
}

.table-head,
.stock-row{
  display:grid;
  grid-template-columns:minmax(270px,1.8fr) 140px 120px 180px 120px 140px 140px;
  gap:12px;
  align-items:center;
}

.table-head{
  padding:14px 16px;
  background:#eaf4ff;
  color:#0f172a;
  font-size:13px;
  font-weight:800;
}

.stock-row{
  padding:14px 16px;
  background:#fff;
  color:var(--text);
  border-top:1px solid var(--line);
}

.product-cell{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.product-thumb{
  width:62px;
  height:62px;
  object-fit:cover;
  border-radius:16px;
  background:#eff6ff;
  border:1px solid var(--line);
  flex-shrink:0;
}

.product-copy{
  min-width:0;
}

.product-copy strong{
  display:block;
  font-size:15px;
  line-height:1.45;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.product-copy span{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.price-pill{
  color:var(--success);
  font-weight:900;
}

.stock-editor{
  display:flex;
  align-items:center;
  gap:8px;
}

.step-btn{
  width:34px;
  height:34px;
  border:none;
  border-radius:50%;
  background:#e2e8f0;
  color:#0f172a;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.qty-input{
  width:88px;
  min-height:40px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:12px;
  text-align:center;
  font-size:15px;
  font-weight:800;
  font-family:inherit;
}

.status-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:0 12px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.status-pill.available{
  background:#dcfce7;
  color:#166534;
}

.status-pill.low{
  background:#fef3c7;
  color:#92400e;
}

.status-pill.out{
  background:#fee2e2;
  color:#991b1b;
}

.status-pill.unknown{
  background:#e0f2fe;
  color:#075985;
}

.row-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.save-btn,
.out-btn{
  min-height:38px;
  padding:0 12px;
  border:none;
  border-radius:12px;
  font-family:inherit;
  font-weight:800;
  cursor:pointer;
}

.save-btn{
  background:#0f172a;
  color:#fff;
}

.out-btn{
  background:#fee2e2;
  color:#991b1b;
}

.muted{
  color:var(--muted);
  font-size:13px;
}

.inventory-field-label{
  display:none;
}

.empty-state{
  padding:28px 16px;
  text-align:center;
  color:var(--muted);
  background:#fff;
}

.inventory-footer{
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  color:var(--muted);
  background:#fff;
  border-top:1px solid var(--line);
  font-size:13px;
  font-weight:800;
}

.inventory-pagination{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.inventory-pagination button{
  min-width:92px;
  color:#fff;
  background:#0f172a;
}

.inventory-page-status{
  color:var(--text);
}

.toast{
  position:fixed;
  bottom:20px;
  left:20px;
  min-width:220px;
  padding:12px 16px;
  border-radius:14px;
  color:#fff;
  background:#0f172a;
  box-shadow:0 12px 30px rgba(15,23,42,.28);
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:9999;
}

.toast.show{
  opacity:1;
}

.toast.success{background:#16a34a;}
.toast.error{background:#dc2626;}

@media(max-width:1180px){
  body.admin-page[data-admin-page="inventory"] .stats-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .table-head{
    display:none;
  }

  .stock-row{
    grid-template-columns:1fr;
    gap:10px;
    padding:16px;
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 8px 24px rgba(15,23,42,.06);
  }

  #inventoryRows{
    padding:12px;
    display:grid;
    gap:12px;
  }

  .stock-row > div:not(.product-cell){
    padding:10px 12px;
    background:#f8fafc;
    border-radius:12px;
  }

  .inventory-field-label{
    margin-bottom:5px;
    display:block;
    color:var(--muted);
    font-size:11px;
    font-weight:900;
  }

  .row-actions .inventory-field-label{
    width:100%;
  }
}

@media(max-width:860px){
  .page-head{
    flex-direction:column;
  }

  .filters{
    grid-template-columns:1fr;
  }

  body.admin-page[data-admin-page="inventory"] .stats-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:520px){
  .container{
    padding:22px 12px 36px;
  }

  body.admin-page[data-admin-page="inventory"] .stats-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .product-cell{
    align-items:flex-start;
  }

  .stock-editor{
    width:100%;
  }

  .qty-input{
    flex:1;
    width:auto;
  }

  .inventory-footer{
    align-items:stretch;
  }

  .inventory-pagination{
    justify-content:space-between;
  }
}

@media(max-width:380px){
  body.admin-page[data-admin-page="inventory"] .stats-grid{
    grid-template-columns:1fr;
  }
}
</style>

<body class="admin-page" data-admin-page="inventory">

<div class="container">
  <div class="page-head admin-page-header">
    <div>
      <h1>لوحة المخزون</h1>
      <p>تابع الكميات الموجودة وحدد بسرعة إيه اللي متاح، قليل، أو خلص.</p>
    </div>

    <div class="head-actions">
      <a class="link-btn" href="admin.html">رجوع للإدارة</a>
      <a class="link-btn" href="products-admin.html">إدارة المنتجات</a>
      <button class="primary-btn" type="button" onclick="applyFilter()">تحديث العرض</button>
    </div>
  </div>

  <section class="stats-grid">
    <div class="stat-card">
      <span>كل المنتجات</span>
      <strong id="totalProducts">0</strong>
    </div>
    <div class="stat-card">
      <span>متاح</span>
      <strong id="availableProducts">0</strong>
    </div>
    <div class="stat-card">
      <span>قليل</span>
      <strong id="lowProducts">0</strong>
    </div>
    <div class="stat-card">
      <span>خلصان</span>
      <strong id="outProducts">0</strong>
    </div>
    <div class="stat-card">
      <span>محتاج تحديد كمية</span>

    </div>
  </section>

  <section class="controls-panel">
    <div class="filters">
      <input id="searchInput" class="search-input" type="search" placeholder="ابحث بالاسم أو التصنيف" aria-label="البحث في المخزون">
      <select id="statusFilter" class="filter-select" aria-label="فلترة المخزون حسب الحالة">
        <option value="all">كل الحالات</option>
        <option value="available">متاح</option>
        <option value="low">قليل</option>
        <option value="out">خلصان</option>

      </select>
      <select id="categoryFilter" class="filter-select" aria-label="فلترة المخزون حسب التصنيف">
        <option value="all">كل التصنيفات</option>
      </select>
      <select id="sortFilter" class="filter-select" aria-label="ترتيب نتائج المخزون">
        <option value="name">ترتيب: الاسم</option>
        <option value="qty-desc">ترتيب: الأعلى كمية</option>

    <div class="table-shell">
      <div class="table-head">

        <div>التصنيف</div>
        <div>السعر</div>
        <div>الكمية</div>
        <div>الحالة</div>
        <div>آخر تحديث</div>
        <div>إجراء</div>
      </div>

      <div id="inventoryRows" aria-live="polite">
        <div class="admin-loading">جاري تحميل بيانات المخزون...</div>
      </div>
      <div class="inventory-footer">
        <span id="inventorySummary">جاري التحميل...</span>
        <div class="inventory-pagination">
          <button id="prevInventoryPageBtn" type="button" onclick="changeInventoryPage(-1)" disabled>السابق</button>
          <span class="inventory-page-status" id="inventoryPageStatus">صفحة 1 من 1</span>

        </div>
      </div>

  </section>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  updateDoc,
  doc,
  serverTimestamp,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2ff2ZaA-Xb_zQcVSUDaERS-glaFFR0TY",
  authDomain: "kimo-tech-store-962df.firebaseapp.com",
  projectId: "kimo-tech-store-962df",
  storageBucket: "kimo-tech-store-962df.firebasestorage.app",
  messagingSenderId: "845478890277",
  appId: "1:845478890277:web:3cdd3328bde1b5b9dda8cc"
};

const LOW_STOCK_LIMIT = 5;
const INVENTORY_PAGE_SIZE = 50;

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const searchInput = document.getElementById("searchInput");
const statusFilter = document.getElementById("statusFilter");
const categoryFilter = document.getElementById("categoryFilter");
const sortFilter = document.getElementById("sortFilter");
const rowsContainer = document.getElementById("inventoryRows");

let allProducts = [];
let filteredInventory = [];
let currentInventoryPage = 1;
let inventoryLoaded = false;
let inventoryLoadFailed = false;

searchInput.addEventListener("input", () => applyFilter({ resetPage:true }));
statusFilter.addEventListener("change", () => applyFilter({ resetPage:true }));
categoryFilter.addEventListener("change", () => applyFilter({ resetPage:true }));
sortFilter.addEventListener("change", () => applyFilter({ resetPage:true }));

onAuthStateChanged(auth, async (user) => {
  if(!user){
    window.location.href = "admin-login.html";
    return;
  }

  try{
    const userDoc = await getDoc(doc(db, "users", user.uid));

    if(!userDoc.exists()){
      window.location.href = "admin-login.html";
      return;
    }

    const role = String(userDoc.data().role || "").trim().toLowerCase();

    if(role !== "owner"){
      alert("غير مصرح لك بالدخول");
      window.location.href = "dashboard.html";
      return;
    }

    sessionStorage.setItem("adminRole", role);
    window.setAdminNavigationRole?.(role);
    startInventoryListener();
  }catch(error){
    console.error(error);
    showInventoryError("تعذر التحقق من صلاحية الدخول. تأكد من اتصال الإنترنت ثم حدّث الصفحة.");
  }
});

function getStockQuantity(product){
  if(product?.stockQty === null || product?.stockQty === undefined || product?.stockQty === ""){
    return null;
  }

  const parsed = Number(product.stockQty);
  return Number.isFinite(parsed) ? Math.max(0, parsed) : null;
}

function getStockStatus(product){
  const qty = getStockQuantity(product);

  if(qty === null){
    return product.inStock
      ? { key:"unknown", label:"متاح بدون رقم" }
      : { key:"out", label:"خلصان" };
  }

  if(qty <= 0) return { key:"out", label:"خلصان" };
  if(qty <= LOW_STOCK_LIMIT) return { key:"low", label:"قليل" };
  return { key:"available", label:"متاح" };
}

function formatDate(value){
  if(!value?.toDate) return "—";
  return value.toDate().toLocaleString("ar-EG", {
    dateStyle:"short",
    timeStyle:"short"
  });
}

function formatPrice(value){
  return `${Number(value) || 0} ج.م`;
}

function escapeHtml(text){
  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function showToast(message, type = "success"){
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.className = `toast ${type} show`;

  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => {
    toast.className = `toast ${type}`;
  }, 2600);
}

function updateInventoryPager(totalProducts){
  const totalPages = Math.max(1, Math.ceil(totalProducts / INVENTORY_PAGE_SIZE));
  currentInventoryPage = Math.min(Math.max(currentInventoryPage, 1), totalPages);

  const firstVisible = totalProducts ? ((currentInventoryPage - 1) * INVENTORY_PAGE_SIZE) + 1 : 0;
  const lastVisible = totalProducts ? Math.min(currentInventoryPage * INVENTORY_PAGE_SIZE, totalProducts) : 0;

  document.getElementById("inventorySummary").textContent =
    `${totalProducts} منتج • المعروض ${firstVisible}-${lastVisible}`;
  document.getElementById("inventoryPageStatus").textContent =
    `صفحة ${currentInventoryPage} من ${totalPages}`;
  document.getElementById("prevInventoryPageBtn").disabled = currentInventoryPage <= 1;
  document.getElementById("nextInventoryPageBtn").disabled = currentInventoryPage >= totalPages;
}

function showInventoryError(message){
  inventoryLoaded = true;
  inventoryLoadFailed = true;
  rowsContainer.innerHTML = `<div class="admin-empty">${escapeHtml(message)}</div>`;
  document.getElementById("inventorySummary").textContent = message;
  document.getElementById("inventoryPageStatus").textContent = "صفحة 1 من 1";
  document.getElementById("prevInventoryPageBtn").disabled = true;
  document.getElementById("nextInventoryPageBtn").disabled = true;
}

function populateCategories(){
  const current = categoryFilter.value;
  const categories = [...new Set(allProducts.map((product) => product.category).filter(Boolean))].sort();

  categoryFilter.innerHTML = `<option value="all">كل التصنيفات</option>`;
  categories.forEach((category) => {
    categoryFilter.innerHTML += `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`;
  });

  if([...categoryFilter.options].some((option) => option.value === current)){
    categoryFilter.value = current;
  }
}

function updateStats(){
  const totals = {
    total: allProducts.length,
    available: 0,
    low: 0,
    out: 0,
    unknown: 0
  };

  allProducts.forEach((product) => {
    const status = getStockStatus(product).key;
    totals[status] += 1;
  });

  document.getElementById("totalProducts").textContent = totals.total;
  document.getElementById("availableProducts").textContent = totals.available;
  document.getElementById("lowProducts").textContent = totals.low;
  document.getElementById("outProducts").textContent = totals.out;
  document.getElementById("unknownProducts").textContent = totals.unknown;
}

function getFilteredProducts(){
  const query = searchInput.value.trim().toLowerCase();
  const statusValue = statusFilter.value;
  const categoryValue = categoryFilter.value;
  const sortValue = sortFilter.value;

  const filtered = allProducts.filter((product) => {
    const status = getStockStatus(product).key;
    const matchesQuery =
      !query ||
      product.name?.toLowerCase().includes(query) ||
      product.category?.toLowerCase().includes(query);
    const matchesStatus = statusValue === "all" || status === statusValue;
    const matchesCategory = categoryValue === "all" || product.category === categoryValue;

    return matchesQuery && matchesStatus && matchesCategory;
  });

  filtered.sort((a, b) => {
    const qtyA = getStockQuantity(a);
    const qtyB = getStockQuantity(b);

    if(sortValue === "qty-desc"){
      return (qtyB ?? -1) - (qtyA ?? -1);
    }

    if(sortValue === "qty-asc"){
      return (qtyA ?? Number.MAX_SAFE_INTEGER) - (qtyB ?? Number.MAX_SAFE_INTEGER);
    }

    return (a.name || "").localeCompare(b.name || "", "ar");
  });

  return filtered;
}

function renderInventory(list){
  updateInventoryPager(list.length);

  if(!list.length){
    const hasActiveFilters =
      searchInput.value.trim() ||
      statusFilter.value !== "all" ||
      categoryFilter.value !== "all";
    const emptyMessage = hasActiveFilters
      ? "لا توجد منتجات مطابقة للفلتر الحالي."
      : "لا توجد منتجات مضافة إلى المخزون حتى الآن.";
    rowsContainer.innerHTML = `<div class="admin-empty">${emptyMessage}</div>`;
    return;
  }

  const startIndex = (currentInventoryPage - 1) * INVENTORY_PAGE_SIZE;
  const visibleProducts = list.slice(startIndex, startIndex + INVENTORY_PAGE_SIZE);

  rowsContainer.innerHTML = visibleProducts.map((product) => {
    const qty = getStockQuantity(product);
    const status = getStockStatus(product);
    const value = qty === null ? "" : qty;
    const placeholder = product.inStock ? "حدد الكمية" : "0";
    const productId = escapeHtml(JSON.stringify(product.id));
    const quantityInputId = `qty-${escapeHtml(product.id)}`;

    return `
      <div class="stock-row">
        <div class="product-cell">
          <img class="product-thumb" src="${escapeHtml(product.image || "images/no-image.png")}" alt="${escapeHtml(product.name || "منتج")}" onerror="this.src='images/no-image.png';this.onerror=null;">
          <div class="product-copy">
            <strong>${escapeHtml(product.name || "منتج بدون اسم")}</strong>
            <span>${escapeHtml(product.badge || product.description || "بدون ملاحظات")}</span>
          </div>
        </div>

        <div>
          <span class="inventory-field-label">التصنيف</span>
          ${escapeHtml(product.category || "-")}
        </div>
        <div class="price-pill">
          <span class="inventory-field-label">السعر</span>
          ${formatPrice(product.price)}
        </div>

        <div>
          <span class="inventory-field-label">الكمية</span>
          <div class="stock-editor">
            <button class="step-btn" type="button" onclick='adjustQty(${productId}, -1)' aria-label="تقليل الكمية">-</button>
            <input id="${quantityInputId}" class="qty-input" type="number" min="0" step="1" inputmode="numeric" value="${value}" placeholder="${placeholder}" aria-label="كمية ${escapeHtml(product.name || "المنتج")}">
            <button class="step-btn" type="button" onclick='adjustQty(${productId}, 1)' aria-label="زيادة الكمية">+</button>
          </div>
        </div>

        <div>
          <span class="inventory-field-label">الحالة</span>
          <span class="status-pill ${status.key}">${status.label}</span>
        </div>
        <div class="muted">
          <span class="inventory-field-label">آخر تحديث</span>
          ${formatDate(product.stockUpdatedAt || product.createdAt)}
        </div>

        <div class="row-actions">
          <span class="inventory-field-label">الإجراءات</span>
          <button class="save-btn" type="button" onclick='saveStock(${productId})'>حفظ</button>
          <button class="out-btn" type="button" onclick='markOut(${productId})'>خلص</button>
        </div>
      </div>
    `;
  }).join("");
}

function startInventoryListener(){
  onSnapshot(collection(db, "products"), (snapshot) => {
    allProducts = snapshot.docs.map((docSnap) => ({
      id: docSnap.id,
      ...docSnap.data()
    })).filter((product) => product.deleted !== true);

    inventoryLoaded = true;
    inventoryLoadFailed = false;
    populateCategories();
    updateStats();
    applyFilter({ resetPage:false });
  }, (error) => {
    console.error(error);
    showInventoryError("تعذر تحميل بيانات المخزون من قاعدة البيانات. حاول تحديث الصفحة.");
    showToast("تعذر تحميل بيانات المخزون", "error");
  });
}

function applyFilter(options = {}){
  if(!inventoryLoaded || inventoryLoadFailed){
    return;
  }

  if(options.resetPage){
    currentInventoryPage = 1;
  }

  filteredInventory = getFilteredProducts();
  renderInventory(filteredInventory);
}

window.applyFilter = applyFilter;

window.changeInventoryPage = function(direction){
  const totalPages = Math.max(1, Math.ceil(filteredInventory.length / INVENTORY_PAGE_SIZE));
  const nextPage = currentInventoryPage + Number(direction || 0);

  if(nextPage < 1 || nextPage > totalPages){
    return;
  }

  currentInventoryPage = nextPage;
  renderInventory(filteredInventory);
};

window.adjustQty = function(id, delta){
  const input = document.getElementById(`qty-${id}`);
  if(!input) return;

  const currentValue = Math.max(0, Number(input.value) || 0);
  input.value = currentValue + delta < 0 ? 0 : currentValue + delta;
};

window.saveStock = async function(id){
  const input = document.getElementById(`qty-${id}`);
  if(!input) return;

  const rawValue = input.value.trim();
  const parsedQuantity = Number(rawValue);

  if(
    rawValue === "" ||
    !Number.isFinite(parsedQuantity) ||
    !Number.isInteger(parsedQuantity) ||
    parsedQuantity < 0
  ){
    showToast("اكتب كمية صحيحة تساوي صفر أو أكبر", "error");
    input.focus();
    return;
  }

  const qty = parsedQuantity;
  const actionButtons = [...input.closest(".stock-row").querySelectorAll(".row-actions button")];
  actionButtons.forEach((button) => button.disabled = true);

  try{
    await updateDoc(doc(db, "products", id), {
      stockQty: qty,
      inStock: qty > 0,
      stockUpdatedAt: serverTimestamp()
    });

    showToast("تم تحديث المخزون ✅", "success");
  }catch(error){
    console.error(error);
    showToast("حصل خطأ في تحديث المخزون ❌", "error");
  }finally{
    actionButtons.forEach((button) => button.disabled = false);
  }
};

window.markOut = async function(id){
  const input = document.getElementById(`qty-${id}`);
  if(!input) return;

  input.value = 0;
  await window.saveStock(id);
};
</script>

</body>
</html>
