<script>

let selectedIndex = -1;



function add(){
let r=document.getElementById("table").insertRow();
r.innerHTML=`
<td>
<input class="product" oninput="searchProduct(this)">
<div class="results"></div>
</td>
<td><input class="p" type="number"></td>
<td><input class="q" type="number" value="1"></td>
<td class="t">0</td>
`;
}

document.addEventListener("input",calc);

function calc(){
let q=document.querySelectorAll(".q");
let p=document.querySelectorAll(".p");
let t=document.querySelectorAll(".t");

let g=0;

for(let i=0;i<q.length;i++){
let v=q[i].value*p[i].value;
t[i].innerText=v;
g+=v;
}

document.getElementById("grand").innerText=g;
}

function searchProduct(input){

let text = normalizeProductText(input.value);
let results = input.parentElement.querySelector(".results");

results.innerHTML="";
selectedIndex = -1;

if(text.length < 1) return;

allProducts
.filter((d)=> d.name && normalizeProductText(d.name).includes(text))
.slice(0, 12)
.forEach((d)=>{

let div=document.createElement("div");
div.innerText=d.name+" - "+d.price+" EGP";

div.onclick=function(){
selectProduct(input, d);
};

results.appendChild(div);
});
}
function highlight(items){

items.forEach(el => el.style.background="white");

if(items[selectedIndex]){
items[selectedIndex].style.background="#dfefff";
}
}

function normalizeProductText(value){
return String(value || "").toLowerCase().trim();
}

function getCatalogPayloadProducts(payload){
if(Array.isArray(payload)) return payload;
if(Array.isArray(payload?.products)) return payload.products;
return [];
}

function getEmbeddedImportedProducts(){
return getCatalogPayloadProducts(globalThis[IMPORTED_CATALOG_GLOBAL]);
}

function mergeProducts(...groups){
let merged = [];
let seen = new Set();

groups.flat().forEach((product)=>{
if(!product) return;

let key = [
String(product.sourceSite || ""),
String(product.sourceProductId || ""),
normalizeProductText(product.name),
Number(product.price) || 0
].join("__");

if(seen.has(key)) return;

seen.add(key);
merged.push(product);
});

return merged;
}

async function fetchImportedProducts(){
let embeddedProducts = getEmbeddedImportedProducts();
if(embeddedProducts.length) return embeddedProducts;

try{
let response = await fetch(IMPORTED_CATALOG_URL, { cache:"no-store" });
if(!response.ok) throw new Error(`HTTP ${response.status}`);
return getCatalogPayloadProducts(await response.json());
}catch(error){
console.error("Imported catalog could not be loaded:", error);
return [];
}
}

function selectProduct(input, product){

input.value = product.name;

let row = input.closest("tr");
row.querySelector(".p").value = product.price;

calc();

let results = input.parentElement.querySelector(".results");
results.innerHTML="";
}


let invoice = "INV-"+Date.now();
let currentInvoiceNumber = invoice;
const IMPORTED_CATALOG_URL = "data/makers-electronics-products.json";
const IMPORTED_CATALOG_GLOBAL = "__MAKERS_ELECTRONICS_PRODUCTS__";

function getInvoiceRowsData(){
  let rows = document.querySelectorAll("#table tr");
  let items = [];

  rows.forEach((row, index)=>{
    if(index === 0) return;

    let name = row.querySelector(".product")?.value.trim();
    let price = Number(row.querySelector(".p")?.value) || 0;
    let qty = Number(row.querySelector(".q")?.value) || 1;

    if(name){
      items.push({ name, price, qty });
    }
  });

  return items;
}

function getGroupedInvoiceItems(items){
  return Array.from(items.reduce((map, item)=>{
    const key = `${item.name}__${item.price}`;

    if(!map.has(key)){
      map.set(key, {
        name:item.name,
        price:item.price,
        qty:0
      });
    }

    map.get(key).qty += item.qty;
    return map;
  }, new Map()).values());
}

function collectInvoiceState(){
  const items = getInvoiceRowsData();
  const groupedItems = getGroupedInvoiceItems(items);
  const total = groupedItems.reduce((sum,item)=> sum + (item.price * item.qty), 0);
  const now = new Date();

  return {
    id: invoiceId,
    number: currentInvoiceNumber,
    customer: document.getElementById("customer").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    total,
    date: now.toLocaleDateString("ar-EG"),
    printDateTime: now.toLocaleString("ar-EG",{ dateStyle:"medium", timeStyle:"short" }),
    items,
    groupedItems,
    totalPieces: groupedItems.reduce((sum,item)=> sum + item.qty, 0)
  };
}

// استبدل دالة saveInvoice بالكامل بهذا الكود
async function saveInvoice(showSuccess = true){
  const state = collectInvoiceState();
  const data = {
    customer: state.customer,
    phone: state.phone,
    total: state.total,
    date: state.date,
    number: state.number,
    items: state.items
  };

  try{
    if(invoiceId){
      await db.collection("invoices").doc(invoiceId).set(data, { merge: true });
      if(showSuccess) alert("تم التحديث بنجاح ✅");
      return { ...state, id: invoiceId };
    }

    const docRef = await db.collection("invoices").add(data);
    invoiceId = docRef.id;
    localStorage.setItem("invoiceId", invoiceId);
    if(showSuccess) alert("تم الحفظ بنجاح ✅");
    return { ...state, id: invoiceId };
  }catch(e){
    console.error("خطأ في حفظ الفاتورة:", e);
    alert("حصل خطأ في حفظ الفاتورة ❌");
    throw e;
  }
}






async function printA4(){
  const printWindow = window.open("", "", "width=900,height=700");

  if(!printWindow){
    alert("اسمح بفتح نافذة الطباعة أولاً");
    return;
  }

  try{
    const state = await saveInvoice(false);

    printWindow.document.write(buildPrintableInvoiceDocument(state));
    printWindow.document.close();
    printWindow.focus();
    printWindow.onafterprint = () => {
      printWindow.close();
      localStorage.removeItem("invoiceId");
      location.reload();
    };

    setTimeout(() => {
      printWindow.print();
    }, 300);
  }catch(e){
    printWindow.close();
  }
}


async function sendWhatsApp(){
  const whatsappWindow = window.open("about:blank", "_blank");

  if(!whatsappWindow){
    alert("اسمح بفتح واتساب أولاً");
    return;
  }

  const state = await saveInvoice(false);
  
  let msg = `فاتورتك من Kimo Tech\nرقم الفاتورة: ${state.number}\nTotal: ${state.total} EGP`;
  let phone = document.getElementById("phone").value.replace(/^0/,"20");
  
  // فتح رابط الواتساب
  whatsappWindow.location.href = "https://wa.me/"+phone+"?text="+encodeURIComponent(msg);

  // التصفير التلقائي بعد ثانية
  setTimeout(() => { 
    localStorage.removeItem("invoiceId"); 
    location.reload(); 
  }, 1000);
}

async function sendPDF(){
  await saveInvoice(false);
  
  let element = document.querySelector(".box");
  
  // توليد وحفظ ملف PDF
  html2pdf().from(element).save().then(() => {
    // التصفير التلقائي بعد انتهاء التحميل
    setTimeout(() => { 
      localStorage.removeItem("invoiceId"); 
      location.reload(); 
    }, 1000);
  });
}



let allProducts = [];

async function loadProducts(){
  try{
    let [snapshot, importedProducts] = await Promise.all([
      db.collection("products").get(),
      fetchImportedProducts()
    ]);

    let localProducts = [];

    snapshot.forEach(doc=>{
      localProducts.push(doc.data());
    });

    allProducts = mergeProducts(localProducts, importedProducts);

  }catch(e){
    console.error("Error loading products:", e);
  }
}

loadProducts();

async function loadInvoice(){
  if(!invoiceId) return;
  let docRef = await db.collection("invoices").doc(invoiceId).get();
  if(docRef.exists){
    let data = docRef.data();
    currentInvoiceNumber = data.number || currentInvoiceNumber;
    document.getElementById("customer").value = data.customer || "";
    document.getElementById("phone").value = data.phone || "";

    let table = document.getElementById("table");
    // مسح الصفوف القديمة مع الحفاظ على العنوان
    while(table.rows.length > 1) { table.deleteRow(1); }

    if(data.items){
      data.items.forEach(item => {
        let r = table.insertRow();
        r.innerHTML = `
          <td>
            <input class="product" value="${item.name}" oninput="searchProduct(this)">
            <div class="results"></div>
          </td>
          <td><input class="p" type="number" value="${item.price}"></td>
          <td><input class="q" type="number" value="${item.qty}"></td>
          <td class="t">${item.price * item.qty}</td>
        `;
      });
    }
    calc(); // تحديث الإجمالي النهائي
  }
}

}

}

}

// ===== لو في product input =====
if(current.classList.contains("product")){

let items = results.querySelectorAll("div");

if(items.length){

// ⬇️
if(e.key === "ArrowDown"){
e.preventDefault();

selectedIndex++;
if(selectedIndex >= items.length) selectedIndex = 0;

highlight(items);
}

// ⬆️
if(e.key === "ArrowUp"){
e.preventDefault();

selectedIndex--;
if(selectedIndex < 0) selectedIndex = items.length - 1;

highlight(items);
}

// ⏎ اختيار
if(e.key === "Enter"){
e.preventDefault();

if(selectedIndex >= 0){
items[selectedIndex].click();
selectedIndex = -1;
return;
}
}

}

}

// ===== جدول الفاتورة =====
if(e.key === "Enter"){

let row = current.closest("tr");
if(!row) return;

let inputs = Array.from(row.querySelectorAll("input"));
let index = inputs.indexOf(current);

// جوه الصف
if(index < inputs.length - 1){
e.preventDefault();
inputs[index + 1].focus();
}

// آخر خانة → صف جديد
else{
e.preventDefault();

add();

let table = document.getElementById("table");
let newRow = table.rows[table.rows.length - 1];

newRow.querySelector("input").focus();
}

}

});
function goBack(){
  localStorage.removeItem("invoiceId"); // مسح الـ ID المخزن
  window.location.href = "dashboard.html"; // الرجوع للوحة التحكم
}
