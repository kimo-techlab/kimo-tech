<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="shortcut icon" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل دخول الإدارة | KIMO TECH</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="admin-ui.css">
<script src="admin-ui.js" defer></script>
</head>

<body class="admin-page admin-login-page" data-admin-page="login">

<div class="login-box">
  <div class="login-brand">
    <span class="login-brand-mark" aria-hidden="true">K</span>
    <span class="login-eyebrow">KIMO TECH</span>
    <h1>تسجيل دخول الإدارة</h1>
    <p class="login-description">أدخل بيانات الحساب الإداري للوصول إلى لوحة التحكم.</p>
  </div>

  <form id="adminLoginForm" class="login-form" novalidate>
    <div class="login-field">
      <label for="adminEmail">البريد الإلكتروني</label>
      <input
        type="email"
        id="adminEmail"
        name="email"
        placeholder="name@example.com"
        autocomplete="username"
        inputmode="email"
        required
      >
    </div>

    <div class="login-field">
      <label for="adminPass">كلمة المرور</label>
      <input
        type="password"
        id="adminPass"
        name="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
      >
    </div>

    <button type="submit" id="loginButton">تسجيل الدخول</button>
    <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>
  </form>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { 
  getAuth, 
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import {
  getFirestore,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2ff2ZaA-Xb_zQcVSUDaERS-glaFFR0TY",
  authDomain: "kimo-tech-store-962df.firebaseapp.com",
  projectId: "kimo-tech-store-962df",
  appId: "1:845478890277:web:3cdd3328bde1b5b9dda8cc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("adminLoginForm");
const emailInput = document.getElementById("adminEmail");
const passwordInput = document.getElementById("adminPass");
const loginButton = document.getElementById("loginButton");
const loginStatus = document.getElementById("loginStatus");
const allowedRoles = new Set(["owner", "admin"]);
let submitting = false;
let logoutRequested = new URLSearchParams(window.location.search).get("logout") === "1";

function setStatus(message = "", type = ""){
  loginStatus.textContent = message;
  loginStatus.className = `login-status${type ? ` ${type}` : ""}`;
}

function setLoading(isLoading){
  loginButton.disabled = isLoading;
  loginButton.textContent = isLoading ? "جارٍ التحقق..." : "تسجيل الدخول";
  form.setAttribute("aria-busy", String(isLoading));
}

async function getAllowedRole(user){
  const userSnapshot = await getDoc(doc(db, "users", user.uid));
  const role = userSnapshot.exists()
    ? String(userSnapshot.data().role || "").trim().toLowerCase()
    : "";

  return allowedRoles.has(role) ? role : null;
}

async function verifyAdminAccess(user){
  const role = await getAllowedRole(user);

  if(!role){
    sessionStorage.removeItem("adminRole");
    await signOut(auth).catch(()=>{});
    setStatus("هذا الحساب غير مصرح له بالدخول إلى لوحة الإدارة.", "error");
    return false;
  }

  sessionStorage.setItem("adminRole", role);
  setStatus("تم التحقق. جارٍ فتح لوحة الإدارة...", "success");
  window.location.replace("admin.html");
  return true;
}

const storedMessage = sessionStorage.getItem("adminAuthMessage");
if(storedMessage){
  sessionStorage.removeItem("adminAuthMessage");
  setStatus(storedMessage, "error");
}

onAuthStateChanged(auth, async (user) => {
  if(logoutRequested){
    sessionStorage.removeItem("adminRole");

    if(user){
      setLoading(true);
      setStatus("جارٍ تسجيل الخروج...");

      try{
        await signOut(auth);
        logoutRequested = false;
        window.history.replaceState(null, "", "admin-login.html");
        setLoading(false);
        setStatus("تم تسجيل الخروج بنجاح.", "success");
      }catch(error){
        console.error("Logout failed:", error);
        logoutRequested = false;
        window.history.replaceState(null, "", "admin-login.html");
        setLoading(false);
        setStatus("تعذر تسجيل الخروج. حاول مرة أخرى.", "error");
      }

      return;
    }

    logoutRequested = false;
    window.history.replaceState(null, "", "admin-login.html");
    setLoading(false);
    setStatus("تم تسجيل الخروج بنجاح.", "success");
    return;
  }

  if(!user || submitting){
    if(!user){
      sessionStorage.removeItem("adminRole");
    }
    return;
  }

  setLoading(true);
  setStatus("جارٍ التحقق من صلاحية الحساب...");

  try{
    await verifyAdminAccess(user);
  }catch(error){
    console.error("Admin access check failed:", error);
    await signOut(auth).catch(()=>{});
    setStatus("تعذر التحقق من صلاحية الحساب. حاول مرة أخرى.", "error");
  }finally{
    setLoading(false);
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){
    setStatus("من فضلك أدخل البريد الإلكتروني وكلمة المرور.", "error");
    (!email ? emailInput : passwordInput).focus();
    return;
  }

  submitting = true;
  setLoading(true);
  setStatus("جارٍ تسجيل الدخول...");

  try{
    const credential = await signInWithEmailAndPassword(auth, email, password);
    await verifyAdminAccess(credential.user);
  }catch(error){
    console.error("Admin login failed:", error);

    if(auth.currentUser){
      await signOut(auth).catch(()=>{});
    }

    sessionStorage.removeItem("adminRole");
    setStatus(
      error?.code === "auth/too-many-requests"
        ? "تم إيقاف المحاولات مؤقتًا. حاول لاحقًا."
        : "البريد الإلكتروني أو كلمة المرور غير صحيحة.",
      "error"
    );
  }finally{
    submitting = false;
    setLoading(false);
  }
});

</script>

</body>
</html>
